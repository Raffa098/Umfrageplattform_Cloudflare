<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09131f" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <meta name="description" content="Kurze Umfrage zu alltäglichen Entscheidungen · Short survey on everyday decisions">
  <title>Umfrage zu Entscheidungen</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="modulepreload" href="/js/prefs.js">
  <link rel="modulepreload" href="/js/i18n.js">
  <link rel="modulepreload" href="/js/journey.js">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="shell">
    <header class="topbar">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21v-7"/><path d="M12 14c0-4-6-4-6-10"/><path d="M12 14c0-4 6-4 6-10"/></svg></span>
      <span class="brand" id="brand">Anonymous Survey</span>
      <div class="tools">
        <span class="test-badge" id="testBadge" hidden>Test</span>
        <button type="button" class="iconbtn" id="motionBtn" aria-pressed="false" title="Bewegung reduzieren" aria-label="Bewegung reduzieren">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></button>
        <button type="button" class="iconbtn" id="themeBtn" title="Hell/Dunkel" aria-label="Hell/Dunkel umschalten">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
    </header>
    <section id="treatment" hidden></section>
    <main id="screen" class="screen"><div class="loader" aria-label="Laden"><span></span></div></main>
  </div>
  <noscript><p style="padding:24px">Bitte aktiviere JavaScript, um teilzunehmen. · Please enable JavaScript to take part.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
